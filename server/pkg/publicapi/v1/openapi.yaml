openapi: 3.1.0
info:
  title: Auro Public API
  version: v1
  description: >-
    Canonical v1 resource contract shared by Auro API surfaces. The Plugin
    API is the first deployed consumer and applies installation identity plus
    manifest scopes. Plugin-specific context and storage remain extensions.
servers:
  - url: https://plugin-api.auro.ai/v1
    description: Installed Plugin and invocation callback tokens
security:
  - pluginBearer: []
paths:
  /context:
    get:
      operationId: getPluginContext
      summary: Get the authorized Plugin invocation context
      x-auro-contract: plugin_extension
      responses:
        "200":
          description: Plugin context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        default:
          $ref: "#/components/responses/Problem"
  /storage/{scope}:
    get:
      operationId: listPluginStorageKeys
      summary: List Plugin storage keys
      x-auro-contract: plugin_extension
      parameters:
        - $ref: "#/components/parameters/StorageScope"
      responses:
        "200":
          description: Storage keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageKeyListResponse"
        default:
          $ref: "#/components/responses/Problem"
  /storage/{scope}/{key}:
    parameters:
      - $ref: "#/components/parameters/StorageScope"
      - $ref: "#/components/parameters/StorageKey"
    get:
      operationId: getPluginStorageValue
      summary: Get a Plugin storage value
      x-auro-contract: plugin_extension
      responses:
        "200":
          description: Storage value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageValueResponse"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPluginStorageValue
      summary: Put a Plugin storage value
      x-auro-contract: plugin_extension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutStorageValueRequest"
      responses:
        "204":
          description: Stored
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePluginStorageValue
      summary: Delete a Plugin storage value
      x-auro-contract: plugin_extension
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    pluginBearer:
      type: http
      scheme: bearer
      bearerFormat: mpi_ or mpc_ token
  parameters:
    StorageScope:
      name: scope
      in: path
      required: true
      schema:
        type: string
        enum: [user, workspace]
    StorageKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Weak or strong ETag containing the expected positive revision
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reserved for durable retry deduplication as write endpoints adopt it
      schema:
        type: string
        maxLength: 255
  headers:
    ETag:
      description: Weak ETag derived from the resource revision
      schema:
        type: string
  responses:
    Problem:
      description: Stable API problem
      headers:
        X-Request-Id:
          description: Request correlation identifier
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, request_id, error]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
        error:
          type: string
          deprecated: true
          description: Compatibility alias for detail
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    Context:
      type: object
      required: [workspace, config, granted_net_domains, actor]
      properties:
        workspace:
          $ref: "#/components/schemas/ContextWorkspace"
        user:
          $ref: "#/components/schemas/ContextUser"
        config:
          type: object
          additionalProperties: true
        granted_net_domains:
          type: array
          items: { type: string }
        actor:
          type: string
          enum: [member, plugin]
    ContextWorkspace:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
    ContextUser:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    StorageKey:
      type: object
      required: [key, size_bytes, updated_at]
      properties:
        key: { type: string }
        size_bytes: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    StorageKeyListResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/StorageKey"
    StorageValueResponse:
      type: object
      required: [value]
      properties:
        value: { type: string }
    PutStorageValueRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 102400 }
