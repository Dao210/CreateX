name: auro

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: auro
      POSTGRES_USER: ${POSTGRES_USER:-auro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auro}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
